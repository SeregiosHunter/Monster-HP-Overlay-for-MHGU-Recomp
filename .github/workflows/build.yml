name: Build & Upload Artifacts

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment & Build Artifact
        run: |
          python -m venv .venv
          .venv\Scripts\activate
          pip install .
          build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHGU-Recomp-HP-Overlay
          path: build/dist/*
          retention-days: 7
          compression-level: 9
